name: tasknova_flutter
description: A Flutter application for managing tasks with features like speech recognition and AI suggestions.
version: 1.0.0
homepage: https://github.com/yourusername/tasknova_flutter
repository: https://github.com/yourusername/tasknova_flutter.git
issue_tracker: https://github.com/yourusername/tasknova_flutter/issues

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^0.20.1
  google_mobile_ads: ^1.0.0
  speech_to_text: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/audio/